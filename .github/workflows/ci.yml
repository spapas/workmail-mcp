name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          test -z "$(gofmt -l .)" || {
            echo "The following files are not gofmt-formatted:"
            gofmt -l .
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  integration:
    name: GreenMail IMAPS integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Run GreenMail integration suite
        shell: bash
        run: bash scripts/integration-test.sh
