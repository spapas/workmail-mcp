name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PUSH_VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$PUSH_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            echo "Use a version such as v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          SHA="$HEAD_SHA"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
              TAG_SHA="$(git rev-list -n 1 "$VERSION")"

              # Never move a tag that already has a published GitHub Release.
              if curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${REPOSITORY}/releases/tags/${VERSION}" \
                >/dev/null 2>&1; then
                SHA="$TAG_SHA"
                echo "Reusing published tag $VERSION at $SHA"
              else
                # A previous failed run may have created the tag before publishing.
                # Repair only that unpublished tag so it points at the current master.
                if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
                  echo "Repairing unpublished tag $VERSION: $TAG_SHA -> $HEAD_SHA"
                  git tag --force "$VERSION" "$HEAD_SHA"
                  git push --force origin "refs/tags/$VERSION"
                fi
                SHA="$HEAD_SHA"
              fi
            else
              git tag "$VERSION" "$HEAD_SHA"
              git push origin "refs/tags/$VERSION"
              SHA="$HEAD_SHA"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: linux
            goarch: amd64
            extension: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUTPUT="dist/workmail-mcp-${GOOS}-${GOARCH}${{ matrix.extension }}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${OUTPUT}" ./cmd/workmail
          cd dist
          sha256sum "$(basename "${OUTPUT}")" > "$(basename "${OUTPUT}").sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$VERSION" dist/* \
              --generate-notes \
              --verify-tag \
              --target "$SHA" \
              --repo "$GH_REPO"
          fi
